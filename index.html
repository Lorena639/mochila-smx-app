<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Mochila SMX</title>
  <meta name="theme-color" content="#0A1120" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F3F6FB" media="(prefers-color-scheme: light)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/icono-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/app.css">
  <script>try{var t=localStorage.getItem("mochila-tema");if(t==="claro"||t==="oscuro")document.documentElement.dataset.tema=t}catch(e){}</script>
</head>
<body>

  <!-- Pantalla de acceso: lo único que ve quien no tiene la contraseña -->
  <main class="acceso" id="pantallaAcceso">
    <div class="acceso-caja">
      <img class="logo" src="img/logo-digitech.png" alt="Digitech">
      <h1>Mochila SMX</h1>
      <p>Esta página es privada. Escribe la contraseña para entrar.</p>
      <form id="formAcceso">
        <div class="campo">
          <label for="password">Contraseña</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="error" id="errorAcceso" role="alert"></p>
        <button class="boton principal" type="submit" id="botonEntrar">Entrar</button>
      </form>
    </div>
  </main>

  <!-- "Cuenta" del dispositivo: quién eres (sin email, se queda guardado en este móvil/PC) -->
  <main class="acceso" id="pantallaQuien" hidden>
    <div class="acceso-caja">
      <img class="logo" src="img/logo-digitech.png" alt="Digitech">
      <h1>¿Quién eres?</h1>
      <p>Pon tu nombre para que Lorena sepa quién ve su mochila y quién comenta. No hace falta email: este dispositivo lo recordará.</p>
      <form id="formQuien">
        <div class="campo">
          <label for="quienNombre">Tu nombre</label>
          <input id="quienNombre" required maxlength="60" autocomplete="name" placeholder="p. ej. Anna García">
        </div>
        <div class="campo" id="campoRol">
          <label>Eres…</label>
          <div class="roles" role="radiogroup" aria-label="Eres">
            <label><input type="radio" name="rol" value="Profesor/a" checked><span>Profesor/a</span></label>
            <label><input type="radio" name="rol" value="Familia"><span>Familia</span></label>
            <label><input type="radio" name="rol" value="Compañero/a"><span>Compañero/a</span></label>
            <label><input type="radio" name="rol" value="Otro"><span>Otro</span></label>
          </div>
        </div>
        <button class="boton principal" type="submit">Crear mi cuenta y entrar</button>
      </form>
    </div>
  </main>

  <!-- Aquí se dibuja la web al entrar -->
  <div id="app" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
